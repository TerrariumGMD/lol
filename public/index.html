<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
	<title>Prism Proxy</title>

	<link rel="shortcut icon" content="favicon.webp" />

	<script src="/scram/scramjet.all.js"></script>
	<script src="/baremux/index.js"></script>

	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			background:
				radial-gradient(circle at top, rgba(120,120,255,.22), transparent 35%),
				linear-gradient(180deg, #08080d, #020204);
			color: white;
			font-family: Arial, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			overflow-x: hidden;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			background-image: radial-gradient(white 1px, transparent 1px);
			background-size: 55px 55px;
			opacity: .12;
			animation: drift 18s linear infinite;
			pointer-events: none;
		}

		@keyframes drift {
			from { transform: translateY(0); }
			to { transform: translateY(55px); }
		}

		.logo-wrapper {
			position: relative;
			z-index: 1;
			text-align: center;
		}

		.logo {
			width: 180px;
			max-width: 60vw;
			filter: drop-shadow(0 0 30px rgba(255,255,255,.25));
		}

		h1 {
			font-size: clamp(42px, 8vw, 86px);
			margin: 10px 0;
			letter-spacing: -4px;
			text-transform: lowercase;
		}

		.desc {
			position: relative;
			z-index: 1;
			max-width: 620px;
			text-align: center;
			color: #aaa;
			line-height: 1.6;
			padding: 0 20px;
		}

		#sj-form {
			position: relative;
			z-index: 1;
			width: min(680px, 90vw);
			margin-top: 24px;
			padding: 18px;
			border: 1px solid rgba(255,255,255,.14);
			border-radius: 28px;
			background: rgba(255,255,255,.06);
			backdrop-filter: blur(14px);
			box-shadow: 0 25px 70px rgba(0,0,0,.45);
		}

		#sj-address {
			width: 100%;
			padding: 18px 22px;
			border-radius: 999px;
			border: 1px solid rgba(255,255,255,.18);
			outline: none;
			background: rgba(0,0,0,.45);
			color: white;
			font-size: 16px;
		}

		#sj-address::placeholder { color: #777; }

		#sj-address:focus {
			border-color: white;
			box-shadow: 0 0 0 4px rgba(255,255,255,.08);
		}

		#sj-error {
			color: #ff7373;
			margin-top: 20px;
		}

		#sj-error-code {
			color: #ff9999;
			white-space: pre-wrap;
		}

		footer {
			position: fixed;
			left: 24px;
			bottom: 20px;
			z-index: 1;
			color: #777;
			font-size: 13px;
		}

		footer a {
			color: white;
			text-decoration: none;
			margin-right: 18px;
		}

		footer a:hover { text-decoration: underline; }

		.flex-center {
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
		}

		@media (max-width: 650px) {
			footer {
				position: static;
				margin-top: 60px;
				text-align: center;
				padding-bottom: 20px;
			}

			h1 {
				letter-spacing: -2px;
			}
		}
	</style>

	<script src="register-sw.js" defer></script>
	<script src="search.js" defer></script>
	<script src="index.js" defer></script>
</head>

<body>
	<div title="Scramjet Logo" class="flex-center logo-wrapper header-center">
		<img class="logo" src="sj.png" alt="Scramjet" />
		<h1>prism proxy</h1>
	</div>

	<div class="flex-center desc left-margin">
		<p>Search or enter a URL</p>
	</div>

	<form id="sj-form" class="flex-center">
		<input
			id="sj-search-engine"
			value="https://www.google.com/search?q=%s"
			type="hidden"
		/>
		<input id="sj-address" type="text" placeholder="Search or enter a website..." />
	</form>

	<div class="desc left-margin">
		<p id="sj-error"></p>
		<pre id="sj-error-code"></pre>
	</div>

	<footer>
		<div>
			<a href="https://prisms.lol">Games</a>
			<a href="/">Proxy</a>
			<a href="credits.html">Credits</a>
		</div>
		<div>
			<span>Prism Proxy &copy; 2026</span>
		</div>
	</footer>
</body>
</html>
