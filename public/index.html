<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
	<title>prism's proxy</title>
	<link rel="icon" href="data:,">

	<script src="/scram/scramjet.all.js"></script>
	<script src="/baremux/index.js"></script>

	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }

		:root {
			--fg: #e8e8e8;
			--muted: #888899;
			--border: rgba(255,255,255,.10);
			--border-hover: rgba(255,255,255,.62);
		}

		body {
			min-height: 100vh;
			background: #010101;
			color: var(--fg);
			font-family: Arial, sans-serif;
			overflow-x: hidden;
		}

		#star-canvas {
			position: fixed;
			inset: 0;
			z-index: 0;
			pointer-events: none;
		}

		.topbar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 10;
			height: 64px;
			padding: 0 40px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: rgba(1,1,1,.76);
			backdrop-filter: blur(12px);
			border-bottom: 1px solid rgba(255,255,255,.08);
		}

		.logo {
			font-size: 16px;
			font-weight: 700;
			letter-spacing: .05em;
			color: white;
			text-decoration: none;
		}

		.nav {
			display: flex;
			gap: 30px;
		}

		.nav a {
			color: var(--muted);
			text-decoration: none;
			font-size: 13px;
			letter-spacing: .05em;
		}

		.nav a:hover { color: white; }

		main {
			position: relative;
			z-index: 2;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 100px 20px;
		}

		.hero {
			width: min(760px, 92vw);
			text-align: center;
		}

		.hero-glow {
			position: absolute;
			width: 550px;
			height: 250px;
			background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%);
			filter: blur(20px);
			left: 50%;
			top: 35%;
			transform: translate(-50%, -50%);
			pointer-events: none;
		}

		h1 {
			font-size: clamp(64px, 10vw, 130px);
			line-height: .9;
			letter-spacing: -.08em;
			color: white;
			text-transform: lowercase;
			text-shadow: 0 0 40px rgba(255,255,255,.22);
			margin-bottom: 20px;
			position: relative;
		}

		.subtitle {
			color: var(--muted);
			font-size: 16px;
			margin-bottom: 32px;
		}

		#sj-form {
			width: min(700px, 92vw);
			margin: 0 auto;
			padding: 18px;
			border-radius: 28px;
			border: 1px solid var(--border);
			background: rgba(255,255,255,.045);
			backdrop-filter: blur(16px);
			box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 60px rgba(0,0,0,.45);
		}

		#sj-address {
			width: 100%;
			padding: 18px 22px;
			border-radius: 999px;
			border: 1px solid rgba(255,255,255,.16);
			outline: none;
			background: rgba(255,255,255,.03);
			color: white;
			font-size: 16px;
		}

		#sj-address::placeholder { color: #777; }

		#sj-address:focus {
			border-color: var(--border-hover);
			box-shadow: 0 0 0 4px rgba(255,255,255,.04);
		}

		#sj-error {
			margin-top: 20px;
			color: #ff6b6b;
		}

		#sj-error-code {
			color: #ff9b9b;
			white-space: pre-wrap;
		}

		#sj-frame {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			border: none;
			z-index: 9999;
			background: white;
		}

		footer {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 22px;
			z-index: 3;
			text-align: center;
			font-size: 13px;
			color: var(--muted);
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 16px;
			flex-wrap: wrap;
		}

		footer a {
			color: white;
			text-decoration: none;
		}

		footer a:hover { text-decoration: underline; }

		@media (max-width: 650px) {
			.topbar { padding: 0 18px; }
			.nav { gap: 18px; }
			h1 { font-size: 64px; }
		}
	</style>
</head>

<body>
	<canvas id="star-canvas"></canvas>

	<header class="topbar">
		<a href="/" class="logo">prism's proxy</a>
		<nav class="nav">
			<a href="https://prisms.lol">Games</a>
			<a href="/">Proxy</a>
		</nav>
	</header>

	<main>
		<section class="hero">
			<div class="hero-glow"></div>
			<h1>prism's proxy</h1>
			<p class="subtitle">search or enter a URL below</p>

			<form id="sj-form">
				<input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />
				<input id="sj-address" type="text" placeholder="search or enter a website..." />
			</form>

			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>
		</section>
	</main>

	<footer>
		<a href="https://prisms.lol">Games</a>
		<a href="/">Proxy</a>
		<span>prism's proxy © 2026</span>
	</footer>

	<script src="register-sw.js"></script>
	<script src="search.js"></script>

	<script>
		const canvas = document.getElementById("star-canvas");
		const ctx = canvas.getContext("2d");
		let stars = [];

		function resize() {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
			stars = Array.from({ length: Math.floor((canvas.width * canvas.height) / 2600) }, () => ({
				x: Math.random() * canvas.width,
				y: Math.random() * canvas.height,
				r: Math.random() * 1.25 + 0.25,
				a: Math.random() * 0.55 + 0.15
			}));
		}

		function draw() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			for (const star of stars) {
				ctx.beginPath();
				ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
				ctx.fillStyle = `rgba(255,255,255,${star.a})`;
				ctx.fill();
			}
			requestAnimationFrame(draw);
		}

		resize();
		draw();
		window.addEventListener("resize", resize);

		const form = document.getElementById("sj-form");
		const address = document.getElementById("sj-address");
		const searchEngine = document.getElementById("sj-search-engine");
		const error = document.getElementById("sj-error");
		const errorCode = document.getElementById("sj-error-code");

		const { ScramjetController } = $scramjetLoadController();

		const scramjet = new ScramjetController({
			files: {
				wasm: "/scram/scramjet.wasm.wasm",
				all: "/scram/scramjet.all.js",
				sync: "/scram/scramjet.sync.js",
			},
		});

		scramjet.init();

		const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

		form.addEventListener("submit", async (event) => {
			event.preventDefault();

			try {
				await registerSW();
			} catch (err) {
				error.textContent = "Failed to register service worker.";
				errorCode.textContent = err.toString();
				return;
			}

			const url = search(address.value, searchEngine.value);

			const wispUrl =
				(location.protocol === "https:" ? "wss" : "ws") +
				"://" +
				location.host +
				"/wisp/";

			if ((await connection.getTransport()) !== "/libcurl/index.mjs") {
				await connection.setTransport("/libcurl/index.mjs", [
					{ websocket: wispUrl },
				]);
			}

			const frame = scramjet.createFrame();
			frame.frame.id = "sj-frame";
			document.body.appendChild(frame.frame);
			frame.go(url);
		});
	</script>
</body>
</html>
